<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#FCEBD2" />
    </linearGradient>
    <radialGradient id="shopPattern" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#800020" />
      <stop offset="100%" stop-color="#4A0012" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5C061A" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />

  <!-- Elegant Traditional Arch & Canopy -->
  <rect x="50" y="50" width="500" height="300" rx="16" fill="url(#shopPattern)" filter="url(#shadow)" />
  <rect x="65" y="65" width="470" height="270" rx="12" fill="none" stroke="#D4AF37" stroke-width="2" stroke-dasharray="8,6" opacity="0.6" />

  <!-- Traditional Golden Sweets Shop Emblem / Diya -->
  <g transform="translate(300, 165)">
    <!-- Golden Diya / Kalash Base -->
    <path d="M -60 20 Q 0 65 60 20 Q 40 45 -40 45 Z" fill="#D4AF37" />
    <ellipse cx="0" cy="18" rx="60" ry="12" fill="#FFA000" stroke="#FFD54F" stroke-width="1.5" />
    <!-- Flame / Lotus of Purity -->
    <path d="M 0 -35 Q 25 0 0 16 Q -25 0 0 -35 Z" fill="#FFC107" filter="url(#shadow)" />
    <path d="M 0 -22 Q 12 0 0 12 Q -12 0 0 -22 Z" fill="#FF3D00" />
    <circle cx="0" cy="5" r="4" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Sweet Shop Title & Heritage Badge -->
  <text text-anchor="middle" x="300" y="245" font-family="'Georgia', serif" font-size="24" font-weight="bold" fill="#FDFBF7" letter-spacing="2">
    TRADITIONAL MITHAI MAHAL
  </text>
  <text text-anchor="middle" x="300" y="275" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#D4AF37" letter-spacing="1">
    AUTHENTIC PURE DESI GHEE SWEETS &bull; ESTD. HERITAGE
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#FCEBD2" />
    </linearGradient>
    <radialGradient id="rasgullaGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F5F5F0" />
      <stop offset="100%" stop-color="#E0E0D1" />
    </radialGradient>
    <radialGradient id="syrupGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FFFDE7" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FFF9C4" stop-opacity="0.8" />
    </radialGradient>
    <radialGradient id="bowlGrad" cx="50%" cy="40%" r="60%">
      <stop offset="65%" stop-color="#FFFFFF" />
      <stop offset="90%" stop-color="#E0E0E0" />
      <stop offset="100%" stop-color="#9E9E9E" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5C061A" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />

  <circle cx="300" cy="195" r="170" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Glass/Ceramic Bowl -->
  <ellipse cx="300" cy="225" rx="145" ry="85" fill="url(#bowlGrad)" filter="url(#shadow)" stroke="#B0BEC5" stroke-width="2" />
  <ellipse cx="300" cy="220" rx="122" ry="68" fill="url(#syrupGrad)" stroke="#E0E0E0" stroke-width="1.2" />

  <!-- Fresh White Spongy Chhena Rasgullas -->
  <g filter="url(#shadow)">
    <!-- Rasgulla Left -->
    <circle cx="250" cy="210" r="38" fill="url(#rasgullaGrad)" stroke="#D6D6C2" stroke-width="0.8" />
    <!-- Rasgulla Right -->
    <circle cx="350" cy="212" r="37" fill="url(#rasgullaGrad)" stroke="#D6D6C2" stroke-width="0.8" />
    <!-- Rasgulla Center Prime -->
    <circle cx="300" cy="225" r="42" fill="url(#rasgullaGrad)" stroke="#CBCBAE" stroke-width="1" />
  </g>

  <!-- Spongy Texture & Cardamom / Saffron Garnish -->
  <circle cx="295" cy="205" r="1.5" fill="#BDBDBD" opacity="0.6" />
  <circle cx="308" cy="215" r="1.5" fill="#BDBDBD" opacity="0.6" />
  <circle cx="288" cy="225" r="1.5" fill="#BDBDBD" opacity="0.6" />
  <circle cx="312" cy="235" r="1.5" fill="#BDBDBD" opacity="0.6" />

  <!-- Saffron Strands floating on Rasgullas -->
  <path d="M 295 195 Q 300 200 302 208" stroke="#C2185B" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <path d="M 245 188 Q 248 194 252 198" stroke="#C2185B" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <path d="M 345 190 Q 348 196 352 200" stroke="#C2185B" stroke-width="1.5" fill="none" stroke-linecap="round" />

  <!-- Pistachio Silver Sliver -->
  <rect x="298" y="212" width="6" height="2" rx="1" fill="#4CAF50" transform="rotate(25 298 212)" />

  <!-- Label Banner -->
  <g transform="translate(300, 345)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#800020" filter="url(#shadow)" />
    <text text-anchor="middle" y="5" font-family="'Georgia', serif" font-size="14" font-weight="bold" fill="#FDFBF7" letter-spacing="1.5">
      SPONGY BENGALI RASGULLA
    </text>
  </g>
</svg>

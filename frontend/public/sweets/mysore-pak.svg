<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#FCEBD2" />
    </linearGradient>
    <radialGradient id="plateGrad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#FAF0E6" />
      <stop offset="95%" stop-color="#CFD8DC" />
      <stop offset="100%" stop-color="#90A4AE" />
    </radialGradient>
    <linearGradient id="pakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFECB3" />
      <stop offset="45%" stop-color="#FFC107" />
      <stop offset="85%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5C061A" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bg)" />

  <circle cx="300" cy="195" r="170" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Banana Leaf / Golden Thali Base -->
  <ellipse cx="300" cy="225" rx="150" ry="85" fill="url(#plateGrad)" filter="url(#shadow)" stroke="#B0BEC5" stroke-width="2" />
  <ellipse cx="300" cy="225" rx="130" ry="70" fill="#FFFBF0" stroke="#D4AF37" stroke-width="1.5" opacity="0.65" />

  <!-- Rich Porous Ghee Mysore Pak Cubes -->
  <g filter="url(#shadow)">
    <!-- Piece 1 (Left Back) -->
    <polygon points="210,185 270,175 295,205 235,215" fill="url(#pakGrad)" stroke="#B26A00" stroke-width="1" />
    <!-- Porous texture dots -->
    <circle cx="250" cy="195" r="1.5" fill="#E65100" />
    <circle cx="265" cy="190" r="1.5" fill="#B26A00" />

    <!-- Piece 2 (Right Back) -->
    <polygon points="310,175 370,185 345,215 285,205" fill="url(#pakGrad)" stroke="#B26A00" stroke-width="1" />
    <circle cx="330" cy="195" r="1.5" fill="#E65100" />

    <!-- Piece 3 (Center Prime Golden Cube) -->
    <!-- Top Face -->
    <polygon points="260,195 320,185 345,205 285,215" fill="#FFE082" stroke="#FFA000" stroke-width="1" />
    <!-- Front Face (Dark rich honeycomb core) -->
    <polygon points="285,215 345,205 345,245 285,255" fill="#FF8F00" stroke="#E65100" stroke-width="1" />
    <!-- Left Face -->
    <polygon points="260,195 285,215 285,255 260,235" fill="#FFA000" stroke="#E65100" stroke-width="1" />
  </g>

  <!-- Ghee Sheen & Melt Highlights -->
  <line x1="285" y1="215" x2="345" y2="205" stroke="#FFFFFF" stroke-width="1.5" opacity="0.75" />
  <circle cx="305" cy="225" r="2" fill="#E65100" opacity="0.8" />
  <circle cx="320" cy="220" r="1.5" fill="#E65100" opacity="0.8" />
  <circle cx="312" cy="238" r="2" fill="#BF360C" opacity="0.8" />

  <!-- Cardamom Seed Fleck -->
  <circle cx="295" cy="202" r="1.5" fill="#3E2723" />
  <circle cx="325" cy="196" r="1.2" fill="#3E2723" />

  <!-- Label Banner -->
  <g transform="translate(300, 345)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#800020" filter="url(#shadow)" />
    <text text-anchor="middle" y="5" font-family="'Georgia', serif" font-size="14" font-weight="bold" fill="#FDFBF7" letter-spacing="1.5">
      ROYAL GHEE MYSORE PAK
    </text>
  </g>
</svg>

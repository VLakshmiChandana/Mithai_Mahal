<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#FCEBD2" />
    </linearGradient>
    <radialGradient id="ladduGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="60%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#E65100" />
    </radialGradient>
    <radialGradient id="plateGrad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#FAF0E6" />
      <stop offset="95%" stop-color="#D7CCC8" />
      <stop offset="100%" stop-color="#A1887F" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5C061A" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)" />

  <!-- Decorative Mandala Border Elements -->
  <circle cx="300" cy="200" r="175" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4" />
  <circle cx="300" cy="200" r="160" fill="none" stroke="#800020" stroke-width="1" opacity="0.25" />

  <!-- Silver Plate -->
  <ellipse cx="300" cy="225" rx="145" ry="85" fill="url(#plateGrad)" filter="url(#shadow)" stroke="#B0BEC5" stroke-width="2" />
  <ellipse cx="300" cy="225" rx="125" ry="70" fill="#FFF9E6" stroke="#D4AF37" stroke-width="1.5" opacity="0.6" />

  <!-- Boondi Motichoor Laddu (Center Pyramidal Pile) -->
  <!-- Base Laddus -->
  <g filter="url(#shadow)">
    <!-- Back Left -->
    <circle cx="250" cy="225" r="38" fill="url(#ladduGrad)" />
    <!-- Back Right -->
    <circle cx="350" cy="225" r="38" fill="url(#ladduGrad)" />
    <!-- Center Front -->
    <circle cx="300" cy="235" r="42" fill="url(#ladduGrad)" />
    <!-- Top Pyramid Laddu -->
    <circle cx="300" cy="180" r="44" fill="url(#ladduGrad)" />
  </g>

  <!-- Boondi Pearls Texture Details & Pistachio Flakes -->
  <!-- Top Laddu Pearls -->
  <circle cx="285" cy="170" r="4.5" fill="#FFE082" />
  <circle cx="315" cy="172" r="5" fill="#FFE082" />
  <circle cx="295" cy="190" r="4" fill="#FFD54F" />
  <circle cx="310" cy="195" r="4.5" fill="#FFCA28" />
  <!-- Pista Garnish (Green flecks) -->
  <rect x="294" y="160" width="7" height="3" rx="1.5" fill="#4CAF50" transform="rotate(25 294 160)" />
  <rect x="308" y="178" width="6" height="2.5" rx="1" fill="#388E3C" transform="rotate(-30 308 178)" />
  <rect x="282" y="185" width="6" height="2.5" rx="1" fill="#4CAF50" transform="rotate(15 282 185)" />
  <!-- Saffron Strands -->
  <path d="M 298 152 Q 302 156 304 163" stroke="#C2185B" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <path d="M 312 165 Q 315 170 318 173" stroke="#C2185B" stroke-width="1.5" fill="none" stroke-linecap="round" />

  <!-- Edible Silver Vark (Delicate foil accent) -->
  <polygon points="296,168 304,166 301,173" fill="#FFFFFF" opacity="0.9" />
  <polygon points="290,178 296,177 293,183" fill="#FFFFFF" opacity="0.85" />

  <!-- Label Banner -->
  <g transform="translate(300, 345)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#800020" filter="url(#shadow)" />
    <text text-anchor="middle" y="5" font-family="'Georgia', serif" font-size="14" font-weight="bold" fill="#FDFBF7" letter-spacing="1.5">
      PURE DESI GHEE LADDU
    </text>
  </g>
</svg>
